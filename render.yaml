services:
  - type: web
    name: foodverse-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TEXT_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.8-27b
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: foodverse_ai
      - key: SESSION_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
